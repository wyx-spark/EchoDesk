# 赞助渠道配置（可选）。
# Funding configuration (optional).
#
# 目前 EchoDesk 没有开通任何赞助渠道，因此这里**全部注释掉**——保留文件是为了
# 自定义模板生效（内容为空的 FUNDING.yml 不会在仓库页显示 Sponsor 按钮），
# 也避免误填一个并不存在的收款账号对外造成误导。
# EchoDesk currently has no funding channel, so every entry stays commented out:
# nothing is claimed that does not exist.
#
# 维护者若要开通，取消对应行的注释并填入真实账号即可（每个平台一行/一项）。
# To enable later, uncomment the line for that platform and fill in the real account.
# 平台项只接受账号名，不接受 URL；`custom:` 只接受 URL，因此这里**不设置**该项，
# 以免发布物里留下一个并不存在的捐赠链接。
# Each entry takes a bare account name, not a URL. `custom:` takes URLs only, so that
# key is deliberately absent: no placeholder donation link can ship by accident.
#
# github: [<org-or-user>]
# patreon: <account>
# open_collective: <collective>
# ko_fi: <account>
# tidelift: <npm-package>
# community_bridge: <project>
# liberapay: <account>
# issuehunt: <account>
# lfx_crowdfunding: <project>
# polar: <account>
# buy_me_a_coffee: <account>
# thanks_dev: <u/gh/account>
