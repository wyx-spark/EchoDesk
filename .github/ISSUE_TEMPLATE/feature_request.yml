name: 功能建议 / Feature request
description: 提出新功能、改进建议或体验问题。/ Suggest a new feature, an improvement, or a UX problem.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先说明**你想解决的问题**，再说你想要的方案——这样维护者可以给出比你的设想更合适的实现。
        Describe the problem first, then your idea; maintainers may find a better solution.

        离线/合规相关的能力（不联网、数据不出本机、可审计）是本项目的硬约束，请在此前提下提建议。
        Offline/auditable operation is a hard constraint of this project; please keep suggestions within it.

  - type: input
    id: version
    attributes:
      label: EchoDesk 版本 / Version
      description: 设置窗口「关于」页或发布包文件夹名。/ About page in Settings, or the package folder name.
      placeholder: "例如 0.2.2"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题 / Problem statement
      description: |
        现在是什么体验？在什么场景下不顺手？请写具体的使用场景，而不是「希望更智能」这类笼统描述。
        What is the current experience, and in which concrete scenario does it fall short?
      placeholder: |
        例如：我经常要处理同一种格式的合同，每次都要重新填一遍自动化配置……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案 / Proposed solution
      description: 你希望 EchoDesk 变成什么样？界面/指令/配置上如何体现？/ What should EchoDesk do instead?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案 / Alternatives considered
      description: |
        你试过哪些变通做法？为什么不够用？/ What workarounds did you try, and why are they insufficient?
    validations:
      required: false

  - type: dropdown
    id: contribute
    attributes:
      label: 你能否参与实现 / Can you help implement it?
      description: |
        无论选哪个都可以提交；如果能实现，维护者会在 Issue 里与你确认方案细节与接口约定。
        Any answer is fine; if you can implement it, maintainers will agree on the design in the issue first.
      options:
        - 可以，我愿意提交 PR / Yes, I can open a PR
        - 可以，但需要有人指导方向 / Yes, with guidance
        - 只能提供测试与反馈 / I can test and give feedback only
        - 不能，只是提出建议 / No, suggestion only
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充说明 / Additional context
      description: 截图、类似工具的做法、参考资料等。/ Screenshots, how other tools solve it, references.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认 / Before you submit
      options:
        - label: 我已搜索过现有 Issue 与 Discussions，确认没有重复建议。/ I searched existing issues and discussions.
          required: true
