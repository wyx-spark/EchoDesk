name: Release / 发布

# 任务书 1.4「发布：打标签时自动构建发布物并上传到 GitHub Releases
#            （不含模型的必需，含模型的可选）」。
#
# 构建命令全部来自仓库真实的 tools\build_release.ps1（PyInstaller onedir + dotnet publish
# 多文件 + 资源收集 + rcedit 元数据 + 快捷方式），CI 不另造一套构建流程。
# Task list 1.4 "Release: build the release artifacts on tag push and upload them to
#               GitHub Releases (model-free packages are required, model-included optional)".
#
# All build commands come from the repository's real tools\build_release.ps1 (PyInstaller onedir + dotnet publish
# multi-file + resource collection + rcedit metadata + shortcut); CI does not build a separate pipeline of its own.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（手触发时必填，例如 0.2.1）"
        required: true
        type: string
      include_models:
        description: "构建含模型的离线包（约 1GB，默认关闭）"
        required: false
        type: boolean
        default: false

# softprops/action-gh-release 需要写 Release/标签的权限；不使用任何自定义密钥，
# 只用 Actions 自动提供的 secrets.GITHUB_TOKEN。
# softprops/action-gh-release needs permission to write the Release/tag; no custom secret is used,
# only the secrets.GITHUB_TOKEN provided automatically by Actions.
permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  # 本工作流只在 Windows 上构建并发布（runs-on: windows-latest）：PyInstaller 打后端、
  # WPF 前端、rcedit 写入版本资源、Inno Setup 编译安装程序都只能在 Windows 上完成。
  # This workflow only builds and publishes on Windows (runs-on: windows-latest): the PyInstaller-packaged backend,
  # the WPF frontend, rcedit version-resource patching and Inno Setup installer compilation all require Windows.
  release:
    name: Build and publish release
    runs-on: windows-latest
    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v4

      - name: Set up Python 3.13 / 安装 Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # frontend/EchoDesk.csproj 目标框架为 net10.0-windows，需要 .NET 10 SDK。
      # frontend/EchoDesk.csproj targets net10.0-windows, so the .NET 10 SDK is required.
      - name: Set up .NET SDK / 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install backend dependencies / 安装后端依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # 后端打包（PyInstaller）与运行期依赖都在这里：pyinstaller 用于 backend\EchoBackend.spec，
          # llama-cpp-python 由 requirements.txt 的 --extra-index-url 提供 CPU 预编译 wheel。
          # Backend packaging (PyInstaller) and runtime dependencies are both handled here: pyinstaller is used for backend\EchoBackend.spec,
          # and llama-cpp-python comes from the CPU prebuilt wheel provided by --extra-index-url in requirements.txt.
          python -m pip install -r backend/requirements.txt

      - name: Resolve release version / 解析发布版本号
        id: version
        shell: pwsh
        run: |
          $version = ""
          if ("${{ github.event_name }}" -eq "push") {
              # 标签推送：v0.2.1 → 0.2.1
              # Tag push: v0.2.1 -> 0.2.1
              $version = "${{ github.ref_name }}".TrimStart("v")
          }
          else {
              $version = "${{ inputs.version }}".Trim()
          }
          if ($version -notmatch '^\d+\.\d+\.\d+') {
              throw "无法确定版本号（得到 '$version'）。标签推送请使用 vX.Y.Z；手动触发请填写 version 输入。"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "本次发布版本: v$version"

      - name: Prepare toolchain (rcedit + Inno Setup) / 准备工具链（rcedit + Inno Setup）
        shell: pwsh
        run: |
          # 打包需要两个第三方工具，都不入库（publish\ 在 .gitignore 里）：
          #   * rcedit（publish\rcedit-x64.exe）—— 只用于**前端** app\EchoDesk.exe 的
          #     版本资源与图标。后端由 PyInstaller spec 的 version/icon 参数写入。
          #     绝不能作用于 PyInstaller 产物，也**绝不能作用于最终的 Inno Setup
          #     安装包**：rcedit 会重建 PE 映像并丢弃追加在映像之后的数据
          #     （Inno 的安装数据就追加在那里），实测会把安装包削成无法运行的空壳。
          #   * Inno Setup 6（ISCC.exe）—— 由 tools\make_installer.ps1 调用，编译安装程序
          #     （一份，不含模型）。
          # 旧方案需要的 7zS.sfx 已不再需要：7-Zip 自解压包方案整体废弃
          # （官方 SFX 模块不支持 InstallPath，会把内容解压到 %TEMP% 后清理），
          # 详细结论见 tools\make_installer.ps1 头部说明。
          # Packaging needs two third-party tools, neither of which is committed (publish\ is in .gitignore):
          #   * rcedit (publish\rcedit-x64.exe) -- used only for the **frontend** app\EchoDesk.exe
          #     version resource and icon. The backend is written by the version/icon parameters of the PyInstaller spec.
          #     It must never be applied to PyInstaller output, and **never to the final Inno Setup
          #     installer**: rcedit rebuilds the PE image and discards data appended after the image
          #     (which is exactly where Inno's installer data is appended), in practice it turns the installer into an unrunnable shell.
          #   * Inno Setup 6 (ISCC.exe) -- invoked by tools\make_installer.ps1 to compile the installer
          #     (a single one, without models).
          # The 7zS.sfx needed by the old approach is no longer required: the 7-Zip self-extracting package approach is abandoned entirely
          # (the official SFX module does not support InstallPath and extracts the contents to %TEMP% and then cleans up),
          # see the header notes of tools\make_installer.ps1 for the detailed conclusion.
          New-Item -ItemType Directory -Force -Path publish | Out-Null

          # rcedit：复用仓库自带的下载脚本（默认下到 tools\），再放一份到 publish\ 供构建脚本取用
          # rcedit: reuse the repository's own download script (downloads to tools\ by default), then place a copy in publish\ for the build scripts
          if (-not (Test-Path "publish\rcedit-x64.exe")) {
              & cmd /c "tools\fetch_tools.bat"
              if (Test-Path "tools\rcedit-x64.exe") {
                  Copy-Item "tools\rcedit-x64.exe" "publish\rcedit-x64.exe" -Force
              }
          }
          if (-not (Test-Path "publish\rcedit-x64.exe")) {
              throw "rcedit 不可用：前端 exe 无法写入版本资源与图标。"
          }

          # Inno Setup 6：托管 runner 上通常没有预装，用 Chocolatey 装。
          # make_installer.ps1 会自动探测（注册表 → Program Files → %LOCALAPPDATA%\Programs → PATH），
          # 这里只负责保证它确实在机器上。
          # Inno Setup 6: it is usually not preinstalled on hosted runners, so install it with Chocolatey.
          # make_installer.ps1 probes it automatically (registry -> Program Files -> %LOCALAPPDATA%\Programs -> PATH);
          # this step only makes sure it really is present on the machine.
          function Find-Iscc {
              $cands = @()
              foreach ($base in @(${env:ProgramFiles(x86)}, ${env:ProgramFiles}, (Join-Path $env:LOCALAPPDATA "Programs"))) {
                  if ($base) { $cands += (Join-Path $base "Inno Setup 6\ISCC.exe") }
              }
              return ($cands | Where-Object { Test-Path $_ } | Select-Object -First 1)
          }
          $iscc = Find-Iscc
          if (-not $iscc) {
              Write-Host "未找到 ISCC.exe，尝试用 Chocolatey 安装 Inno Setup 6 ..."
              choco install innosetup -y --no-progress
              $iscc = Find-Iscc
          }
          if (-not $iscc) { throw "Inno Setup 6（ISCC.exe）不可用，无法编译安装程序。" }
          Write-Host "工具链就位: rcedit $(Test-Path 'publish\rcedit-x64.exe') · ISCC $iscc"

      - name: Build release package / 构建发布包
        shell: pwsh
        env:
          # workflow_dispatch 的布尔输入；标签推送时未提供，按 false（不含模型）处理。
          # Boolean input of workflow_dispatch; on tag push it is not provided and is treated as false (without models).
          INCLUDE_MODELS: ${{ inputs.include_models || 'false' }}
        run: |
          # 直接调用真实构建脚本（产物目录 publish\EchoDesk-v<版本>）。
          # 说明：
          #   * 脚本第 0 步会在缺少 tools\rcedit-x64.exe 时自动调用 tools\fetch_tools.bat 下载，
          #     下载失败只警告并跳过版本资源写入，不影响构建成功；
          #   * -IncludeModels 只在上面输入为真时追加：把本地 .gguf 复制进**便携发布目录**
          #     （供自托管 runner 或外部做离线便携版/模型补充包用）。
          #     **它不会让安装程序含模型** —— 安装程序一律不含模型（见 tools\installer.ps1
          #     头部说明），GitHub 托管 runner 上本来也没有 .gguf。
          # 具名参数用哈希表 splat（数组 splat 会把 "-Version" 当成第一个位置参数的值）
          # -MakeInstaller：发布任务书「任务四」要求构建脚本末尾收口出交付物：
          # 安装程序 EchoDesk-v<版本>-Setup.exe（**一份，不含模型**）+ SHA256SUMS.txt。
          # 安装程序由 Inno Setup 6 编译（ISCC.exe 由上一个步骤准备好），rcedit 只用于前端 exe。
          # 旧名 -MakeSfx 仍可用，但它只是别名：7-Zip 自解压包方案已废弃。
          # Call the real build script directly (output directory publish\EchoDesk-v<version>).
          # Notes:
          #   * Step 0 of the script automatically calls tools\fetch_tools.bat to download when tools\rcedit-x64.exe is missing;
          #     a failed download only warns and skips writing the version resource, it does not affect build success;
          #   * -IncludeModels is appended only when the input above is true: it copies local .gguf files into the **portable release directory**
          #     (for self-hosted runners or for building an offline portable version / model supplement package externally).
          #     **It does not make the installer contain models** -- the installer never contains models (see the header notes of
          #     tools\installer.ps1), and GitHub hosted runners have no .gguf files anyway.
          # Named parameters use hashtable splatting (array splatting would treat "-Version" as the value of the first positional parameter)
          # -MakeInstaller: release task list "Task 4" requires the build script to end by producing the deliverables:
          # the installer EchoDesk-v<version>-Setup.exe (**a single one, without models**) + SHA256SUMS.txt.
          # The installer is compiled by Inno Setup 6 (ISCC.exe is prepared by the previous step); rcedit is used only for the frontend exe.
          # The old name -MakeSfx still works, but it is only an alias: the 7-Zip self-extracting package approach is abandoned.
          $buildArgs = @{ Version = "${{ steps.version.outputs.version }}"; MakeInstaller = $true }
          if ($env:INCLUDE_MODELS -eq "true") {
              Write-Host "包含模型：追加 -IncludeModels"
              $buildArgs["IncludeModels"] = $true
          }
          & ./tools/build_release.ps1 @buildArgs

      - name: Verify package contents / 校验发布物内容
        id: package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $out = "publish\EchoDesk-v$version"
          # 修复七后的便携版三层结构：程序本体在 app\ 下，外层是快捷方式与用户数据。
          # 这里逐项断言，避免"构建成功但结构退化"被打包发出去。
          # The three-layer portable layout after fix seven: the program itself is under app\, the outer layer holds shortcuts and user data.
          # Every item is asserted here so that a "successful build with a degraded structure" is not packaged and shipped.
          $required = @(
              (Join-Path $out "app\EchoDesk.exe"),
              (Join-Path $out "app\EchoDesk.ico"),
              (Join-Path $out "app\backend\EchoDeskBackend.exe"),
              (Join-Path $out "USAGE.txt"),
              (Join-Path $out "install-complete.bat"),
              (Join-Path $out "README.md"),
              (Join-Path $out "README.zh-Hans.md"),
              (Join-Path $out "CHANGELOG.md"),
              (Join-Path $out "LICENSE"),
              (Join-Path $out "LICENSE.zh-Hans.md"),
              (Join-Path $out "NOTICE"),
              (Join-Path $out "NOTICE.zh-Hans.md"),
              (Join-Path $out "SECURITY.md"),
              (Join-Path $out "SECURITY.zh-Hans.md"),
              (Join-Path $out "config.example.json"),
              (Join-Path $out "install-complete.bat"),
              (Join-Path $out "results"),
              (Join-Path $out "docs\PRIVACY.md"),
              (Join-Path $out "docs\PRIVACY.zh-Hans.md"),
              (Join-Path $out "docs\EULA.md"),
              (Join-Path $out "docs\EULA.zh-Hans.md"),
              (Join-Path $out "docs\THIRD_PARTY_LICENSES.md"),
              (Join-Path $out "docs\THIRD_PARTY_LICENSES.zh-Hans.md"),
              (Join-Path $out "docs\SBOM.json")
          )
          foreach ($item in $required) {
              if (-not (Test-Path -LiteralPath $item)) {
                  throw "发布物缺少必需文件: $item"
              }
          }
          # 过程文档（研发/修复/发布记录）不得进包（发布任务书「全局要求五」）
          # Process documents (development/fix/release records) must not be packaged (release task list "global requirement 5")
          $records = @(Get-ChildItem -LiteralPath $out -Recurse -File |
                       Where-Object { $_.Name -match '^(v?0\.\d+\.\d+)-(研发记录|修复记录|发布记录)\.md$' })
          if ($records.Count -gt 0) {
              throw "发布物内含过程文档（应为空）: $($records[0].Name)"
          }
          # 文件名/目录名必须全英文（发布任务书「全局要求一」）
          # File/directory names must be entirely ASCII English (release task list "global requirement 1")
          $cjk = [regex]'[\u3040-\u30ff\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\uac00-\ud7af]'
          $cnNames = @(Get-ChildItem -LiteralPath $out -Recurse -Force |
                       Where-Object { $cjk.IsMatch($_.Name) })
          if ($cnNames.Count -gt 0) {
              throw "发布物内含非 ASCII 文件名/目录名: $($cnNames[0].Name)"
          }
          # 不得预置 .lnk：快捷方式里是绝对路径，在 CI 上生成会把 runner 的路径
          # 带进发布物（任务书「全局要求五」禁止个人绝对路径）。
          # 快捷方式由 install-complete.bat 在用户机器上创建。
          # No .lnk may be preinstalled: shortcuts contain absolute paths, so generating them in CI would carry the runner's
          # paths into the release artifact (task list "global requirement 5" forbids personal absolute paths).
          # Shortcuts are created by install-complete.bat on the user's machine.
          $links = @(Get-ChildItem -LiteralPath $out -Recurse -File -Filter *.lnk)
          if ($links.Count -gt 0) {
              throw "发布物内含预置快捷方式（会泄露构建机绝对路径）: $($links[0].Name)"
          }
          # 外层不得出现程序文件（修复七的硬要求）
          # No program files may appear in the outer layer (hard requirement of fix seven)
          $stray = @(Get-ChildItem -LiteralPath $out -Recurse -File -Include *.exe, *.dll |
                     Where-Object { $_.FullName -notlike (Join-Path $out "app") + "\*" })
          if ($stray.Count -gt 0) {
              throw "外层出现程序文件（应为空）: $($stray[0].FullName)"
          }
          $files = Get-ChildItem -LiteralPath $out -Recurse -File
          $mb = [math]::Round(($files | Measure-Object -Property Length -Sum).Sum / 1MB, 1)
          $hasModels = @(Get-ChildItem -LiteralPath (Join-Path $out "app\backend\models") -Filter *.gguf -File -ErrorAction SilentlyContinue).Count -gt 0
          Write-Host "发布物: $out（$($files.Count) 个文件，$mb MB，含模型: $hasModels）"
          "path=$out" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "mb=$mb" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "has_models=$hasModels" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Zip release package / 压缩发布包
        id: zip
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $out = "${{ steps.package.outputs.path }}"
          $suffix = "win-x64"
          if ("${{ steps.package.outputs.has_models }}" -eq "True") { $suffix = "win-x64-with-models" }
          $zip = "EchoDesk-v$version-$suffix.zip"
          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          # 压缩包内直接是发布物内容（解压后运行一次 install-complete.bat 创建快捷方式，
          # 或直接启动 app\EchoDesk.exe）。
          # Compress-Archive 是 PowerShell 自带能力，不引入额外压缩工具；
          # 注意 Zip 格式单文件上限 2GB——含模型包若超过该限制需改用 7z 分卷。
          # The archive contains the release contents directly (after extraction run install-complete.bat once to create the shortcuts,
          # or just launch app\EchoDesk.exe).
          # Compress-Archive is built into PowerShell, so no extra compression tool is introduced;
          # note the 2GB per-file limit of the Zip format -- a models-included package exceeding it must switch to 7z volumes.
          Compress-Archive -Path (Join-Path $out "*") -DestinationPath $zip -CompressionLevel Optimal
          $zipMb = [math]::Round((Get-Item -LiteralPath $zip).Length / 1MB, 1)
          Write-Host "压缩包: $zip（$zipMb MB）"
          "file=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "mb=$zipMb" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload package artifact / 上传发布物制品
        uses: actions/upload-artifact@v4
        with:
          name: EchoDesk-release-package
          path: ${{ steps.zip.outputs.file }}
          retention-days: 7
          if-no-files-found: error

      - name: Write release notes / 生成发布说明
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $template = ".github/release_notes_template.md"
          if (-not (Test-Path -LiteralPath $template)) {
              throw "缺少发布说明模板: $template"
          }
          $notes = Get-Content -LiteralPath $template -Raw -Encoding UTF8

          # 下载包清单：安装程序（一份，不含模型）+ 便携版压缩包。
          # 安装程序是发布任务书「交付物」的主件；zip 作为"免安装解压版"补充。
          # 离线用户请另发"模型补充包"（把 .gguf 与说明放一起），安装程序本身不含模型。
          # Download package list: the installer (a single one, without models) + the portable zip.
          # The installer is the main piece among the release task list "deliverables"; the zip is a supplement as the "no-install extract-and-run" version.
          # Offline users should ship a separate "model supplement package" (the .gguf files together with instructions); the installer itself contains no models.
          $packageList = @(
              "- ``EchoDesk-v$version-Setup.exe`` —— 安装程序（不含模型，首次启动询问是否下载）",
              "- ``${{ steps.zip.outputs.file }}``（${{ steps.package.outputs.mb }} MB 解压后 / ${{ steps.zip.outputs.mb }} MB 压缩包）—— 免安装解压版",
              "",
              "安装程序双击即可：**默认装到安装程序自己所在的文件夹**（可以在向导里改到别处），",
              "装完自动创建开始菜单快捷方式（勾选后也建桌面快捷方式），卸载走「应用和功能」。",
              "安装结果与便携版目录结构一致：程序本体在 ``app\``，用户数据与 ``results\`` 在外层。",
              "卸载会把程序运行时生成的文件（会话、模型、缓存、日志等）一并清掉，**``results\`` 原样保留**。"
          ) -join "`n"
          $packageList += "`n`n> 安装程序**不含模型**；首次启动会询问是否下载（约 472MB，需联网），也可以自行把 `.gguf` 放进 `app\backend\models\`，或使用配套的模型补充包。"

          # 校验哈希清单（发布任务书「任务七」要求 Release Notes 含校验哈希）
          # Checksum manifest (release task list "Task 7" requires Release Notes to include checksums)
          $shaList = ""
          $shaFile = "publish\SHA256SUMS.txt"
          if (Test-Path -LiteralPath $shaFile) {
              $shaList = (Get-Content -LiteralPath $shaFile -Encoding UTF8 |
                          Where-Object { $_.Trim() }) -join "`n"
          }
          else {
              $shaList = "（未找到 ``SHA256SUMS.txt``，请以 Release 附件中的该文件为准。）"
          }

          # 更新日志节选：从 CHANGELOG.md 抓取 "## v<版本>" 到下一个 "## " 之间的小节
          # Changelog excerpt: capture the section from "## v<version>" up to the next "## " in CHANGELOG.md
          $excerpt = ""
          $changelog = "CHANGELOG.md"
          if (Test-Path -LiteralPath $changelog) {
              $lines = Get-Content -LiteralPath $changelog -Encoding UTF8
              $capture = $false
              $buffer = New-Object System.Collections.ArrayList
              foreach ($line in $lines) {
                  if ($line -match '^##\s') {
                      if ($capture) { break }
                      if ($line -match [regex]::Escape("v$version")) { $capture = $true; continue }
                  }
                  if ($capture) { [void]$buffer.Add($line) }
              }
              $excerpt = ($buffer -join "`n").Trim()
          }
          if ([string]::IsNullOrWhiteSpace($excerpt)) {
              $excerpt = "（未在 ``CHANGELOG.md`` 中找到 ``v$version`` 小节，请维护者在本节手动补写本版变更。）"
          }

          $notes = $notes.Replace("{{VERSION}}", "v$version")
          $notes = $notes.Replace("{{TAG}}", "${{ steps.version.outputs.tag }}")
          $notes = $notes.Replace("{{DATE}}", (Get-Date -Format "yyyy-MM-dd"))
          $notes = $notes.Replace("{{PACKAGE_LIST}}", $packageList)
          $notes = $notes.Replace("{{SHA256_LIST}}", $shaList)
          $notes = $notes.Replace("{{CHANGELOG_EXCERPT}}", $excerpt)

          Set-Content -LiteralPath "release_notes.md" -Value $notes -Encoding UTF8
          Write-Host "已生成 release_notes.md（$([math]::Round((Get-Item release_notes.md).Length / 1KB, 1)) KB）"

      - name: Create GitHub Release / 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: EchoDesk v${{ steps.version.outputs.version }}
          body_path: release_notes.md
          files: |
            ${{ steps.zip.outputs.file }}
            publish/EchoDesk-v${{ steps.version.outputs.version }}-Setup.exe
            publish/SHA256SUMS.txt
            docs/SBOM.json
            docs/THIRD_PARTY_LICENSES.md
            docs/THIRD_PARTY_LICENSES.zh-Hans.md
            CHANGELOG.md
          fail_on_unmatched_files: true
          # 任务书「任务七」要求 Release 先存为草稿：工作流只产出草稿，
          # 由维护者审阅正文与附件后再手动 Publish。
          # Task list "Task 7" requires the Release to be saved as a draft first: the workflow only produces a draft,
          # and the maintainer publishes it manually after reviewing the body and the attachments.
          draft: true
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
