name: CI / 持续集成（轻量）

# 本仓库的完整发布门禁（tools/verify_release.ps1）依赖 Windows 桌面、GUI 探针、
# 本机 Edge 与本地模型，只能在维护者的构建机上运行；在云端 runner 上必然失败。
# The full release gate (tools/verify_release.ps1) depends on a Windows desktop,
# GUI probes, a local Edge installation and local models. It can only run on the
# maintainer's build machine and would always fail on a hosted runner.
#
# 因此云端 CI 只保留**纯 Python 标准库**可运行的静态检查：语言包完整性、
# 反向语言键审计、仓库双语/脚本登记审计、换行符与主题色板对比度。
# 这些检查不安装后端运行时依赖，不启动界面，不打包，几分钟内可完成。
# Cloud CI therefore keeps only static checks that run on the Python standard
# library: language packs, reverse key audit, repository bilingual/script audit,
# line endings, and theme palette contrast. No backend runtime dependencies,
# no GUI, no packaging.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    name: Static checks / 静态检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Language pack completeness / 语言包完整性
        run: python tools/check_lang.py

      - name: Reverse language-key audit / 反向语言键审计
        run: python tools/audit_lang_keys.py

      - name: Repository bilingual and script-registration audit / 仓库双语与脚本登记审计
        run: python tools/audit_repo.py --check

      - name: Line endings / 换行符符合 .gitattributes
        run: python tools/check_line_endings.py

      - name: Theme palette and contrast / 主题色板与对比度
        run: python tools/check_theme.py
